<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City Agent</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c1e21; --muted:#6b7280; --accent:#2563eb; --user:#2563eb; --border:#e5e7eb; --ok:#16a34a; --no:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa0a6; --border:#2a2e36; }
  }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; }
  header { padding:14px 20px; background:var(--card); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:17px; margin:0; }
  #status { font-size:12px; color:var(--muted); }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; max-width:820px; width:100%; margin:0 auto; }
  .msg { max-width:80%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--user); color:#fff; border-bottom-right-radius:4px; }
  .ai { align-self:flex-start; background:var(--card); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .error { align-self:flex-start; background:transparent; border:1px solid var(--no); color:var(--no); }
  .typing { color:var(--muted); font-style:italic; }
  .approval { align-self:flex-start; background:var(--card); border:1px solid var(--accent); border-radius:14px; padding:12px 14px; max-width:80%; }
  .approval code { display:block; margin:6px 0 10px; padding:6px 8px; background:var(--bg); border-radius:8px; font-size:13px; white-space:pre-wrap; }
  .approval button { border:0; padding:7px 16px; border-radius:8px; color:#fff; cursor:pointer; font-size:14px; margin-right:8px; }
  .approve { background:var(--ok); } .reject { background:var(--no); }
  .approval.done button { display:none; }
  .approval .result { color:var(--muted); font-size:13px; }
  form { display:flex; gap:10px; padding:14px 20px; background:var(--card); border-top:1px solid var(--border); max-width:none; }
  .inner { display:flex; gap:10px; max-width:820px; width:100%; margin:0 auto; }
  input { flex:1; padding:11px 14px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:15px; outline:none; }
  input:focus { border-color:var(--accent); }
  #send { padding:0 20px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
  #send:disabled, input:disabled { opacity:.5; cursor:not-allowed; }
</style>
</head>
<body>
<header>
  <h1>🌆 City Agent</h1>
  <span id="status">connecting…</span>
</header>

<div id="chat">
  <div class="msg ai">Hi! Ask me about the weather or the latest news in any city.</div>
</div>

<form id="form">
  <div class="inner">
    <input id="input" type="text" placeholder="e.g. Weather and news in Hyderabad" autocomplete="off" disabled>
    <button id="send" type="submit" disabled>Send</button>
  </div>
</form>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const statusEl = document.getElementById("status");

  let ws, typingEl = null;

  function setBusy(busy) {
    input.disabled = busy || !ws || ws.readyState !== WebSocket.OPEN;
    sendBtn.disabled = input.disabled;
    if (!input.disabled) input.focus();
  }

  function addMsg(text, cls) {
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;           // textContent: never render model/tool output as HTML
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }

  function showTyping() {
    removeTyping();
    typingEl = addMsg("Thinking…", "ai typing");
  }
  function removeTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  function addApproval(tool, args) {
    removeTyping();
    const box = document.createElement("div");
    box.className = "approval";

    const title = document.createElement("div");
    title.textContent = "Agent wants to call: " + tool;

    const code = document.createElement("code");
    code.textContent = JSON.stringify(args);

    const result = document.createElement("div");
    result.className = "result";

    const yes = document.createElement("button");
    yes.className = "approve"; yes.textContent = "Approve";
    const no = document.createElement("button");
    no.className = "reject"; no.textContent = "Reject";

    function answer(approved) {
      ws.send(JSON.stringify({ type: "approval", approved }));
      box.classList.add("done");
      result.textContent = approved ? "✓ Approved" : "✗ Rejected";
      showTyping();
    }
    yes.onclick = () => answer(true);
    no.onclick = () => answer(false);

    box.append(title, code, yes, no, result);
    chat.appendChild(box);
    chat.scrollTop = chat.scrollHeight;
  }

  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = () => { statusEl.textContent = "connected"; setBusy(false); };
    ws.onclose = () => {
      statusEl.textContent = "disconnected – retrying…";
      removeTyping(); setBusy(true);
      setTimeout(connect, 2000);
    };
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === "approval_request") {
        addApproval(msg.tool, msg.args);
      } else if (msg.type === "answer") {
        removeTyping(); addMsg(msg.content, "ai"); setBusy(false);
      } else if (msg.type === "error") {
        removeTyping(); addMsg("Error: " + msg.content, "error"); setBusy(false);
      }
    };
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    addMsg(text, "user");
    ws.send(JSON.stringify({ type: "chat", content: text }));
    input.value = "";
    setBusy(true);
    showTyping();
  });

  connect();
</script>
</body>
</html>
